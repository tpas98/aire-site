<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spinning Can – Aire (v8 both faces)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(180deg, #e4edf6 0%, #dae5f0 50%, #d0dce8 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; overflow: hidden;
    }
    #canvas-wrap { width: 700px; height: 620px; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="canvas-wrap"></div>
  <script src="/three.min.js"></script>
  <script>
  (function() {
    const wrap = document.getElementById('canvas-wrap');
    const W = 700, H = 620;

    const scene = new THREE.Scene();

    /* ── Camera ── */
    const camera = new THREE.PerspectiveCamera(26, W / H, 0.1, 100);
    camera.position.set(0, 1.5, 7.5);
    camera.lookAt(0, 0, 0);

    /* ── Renderer ── */
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(W, H);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.physicallyCorrectLights = true;
    wrap.appendChild(renderer.domElement);

    /* ═══════════════════════════════════════════════════
       ENVIRONMENT MAP — clean studio
       ═══════════════════════════════════════════════════ */
    const envC = document.createElement('canvas');
    envC.width = 2048; envC.height = 1024;
    const ec = envC.getContext('2d');

    const skyGrad = ec.createLinearGradient(0, 0, 0, 1024);
    skyGrad.addColorStop(0, '#c0d0e4');
    skyGrad.addColorStop(0.2, '#d8e4f0');
    skyGrad.addColorStop(0.4, '#eef3f9');
    skyGrad.addColorStop(0.5, '#fafcff');
    skyGrad.addColorStop(0.6, '#f0f4fa');
    skyGrad.addColorStop(0.8, '#dce6f0');
    skyGrad.addColorStop(1, '#b0c0d4');
    ec.fillStyle = skyGrad;
    ec.fillRect(0, 0, 2048, 1024);

    // Panel lights for specular streaks
    function addPanel(x, y, w, h, intensity) {
      ec.save();
      ec.globalAlpha = intensity;
      const g = ec.createLinearGradient(x - w/2, y, x + w/2, y);
      g.addColorStop(0, 'rgba(255,255,255,0)');
      g.addColorStop(0.15, 'rgba(255,255,255,0.7)');
      g.addColorStop(0.5, '#ffffff');
      g.addColorStop(0.85, 'rgba(255,255,255,0.7)');
      g.addColorStop(1, 'rgba(255,255,255,0)');
      ec.fillStyle = g;
      ec.fillRect(x - w/2, y - h/2, w, h);
      ec.restore();
    }

    function addSoft(x, y, r, intensity) {
      ec.save();
      ec.globalAlpha = intensity;
      const g = ec.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, '#ffffff');
      g.addColorStop(0.4, 'rgba(255,255,255,0.5)');
      g.addColorStop(1, 'rgba(255,255,255,0)');
      ec.fillStyle = g;
      ec.beginPath();
      ec.arc(x, y, r, 0, Math.PI * 2);
      ec.fill();
      ec.restore();
    }

    addPanel(1350, 140, 350, 70, 0.6);
    addPanel(500, 180, 280, 55, 0.35);
    addPanel(1024, 480, 900, 35, 0.2);
    addSoft(850, 40, 400, 0.4);
    addSoft(1700, 300, 200, 0.15);
    addPanel(1024, 950, 1400, 50, 0.06);

    const envMap = new THREE.CanvasTexture(envC);
    envMap.mapping = THREE.EquirectangularReflectionMapping;

    /* ═══════════════════════════════════════════════════
       TIN — LatheGeometry for smooth profile
       ═══════════════════════════════════════════════════ */
    const R      = 1.48;
    const lidR   = 1.53;
    const D      = 0.82;
    const lidH   = 0.10;
    const bev    = 0.065;
    const groove = 0.018;
    const segs   = 16;

    function buildProfile() {
      const pts = [];
      function arc(cx, cy, r, a0, a1, n) {
        for (let i = 0; i <= n; i++) {
          const a = a0 + (a1 - a0) * (i / n);
          pts.push(new THREE.Vector2(cx + r * Math.cos(a), cy + r * Math.sin(a)));
        }
      }

      const botY = -D / 2;
      const topBody = D / 2;
      const topLid = D / 2 + lidH;

      // Center of bottom
      pts.push(new THREE.Vector2(0, botY));
      // Bottom face
      pts.push(new THREE.Vector2(R - bev, botY));
      // Bottom bevel
      arc(R - bev, botY + bev, bev, -Math.PI / 2, 0, segs);
      // Body wall
      pts.push(new THREE.Vector2(R, topBody - groove * 3));
      // Seam
      pts.push(new THREE.Vector2(R - groove * 0.6, topBody - groove * 1.5));
      pts.push(new THREE.Vector2(R - groove * 0.8, topBody - groove * 0.3));
      pts.push(new THREE.Vector2(R + groove * 0.3, topBody + 0.003));
      // Lid shoulder
      pts.push(new THREE.Vector2(lidR, topBody + 0.012));
      pts.push(new THREE.Vector2(lidR, topLid - bev));
      // Lid top bevel
      arc(lidR - bev, topLid - bev, bev, 0, Math.PI / 2, segs);
      // Lid center
      pts.push(new THREE.Vector2(0, topLid));

      return pts;
    }

    const profile = buildProfile();
    const latheGeo = new THREE.LatheGeometry(profile, 160);
    latheGeo.computeVertexNormals();

    const bodyMat = new THREE.MeshPhysicalMaterial({
      color: new THREE.Color(0.88, 0.90, 0.93),
      roughness: 0.14,
      metalness: 0.15,
      clearcoat: 0.9,
      clearcoatRoughness: 0.06,
      envMap: envMap,
      envMapIntensity: 0.7,
      side: THREE.DoubleSide,
    });
    const latheMesh = new THREE.Mesh(latheGeo, bodyMat);
    const canGroup = new THREE.Group();
    canGroup.add(latheMesh);

    /* ── Textures ── */
    const loader = new THREE.TextureLoader();
    function cfgTex(tex) {
      tex.encoding = THREE.sRGBEncoding;
      tex.minFilter = THREE.LinearMipmapLinearFilter;
      tex.magFilter = THREE.LinearFilter;
      tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
    }

    /* ── TOP face (front branding) ── */
    const lidTex = loader.load('/public/images/can-front-texture.png');
    cfgTex(lidTex);

    const topY = D / 2 + lidH;
    const lidSize = lidR * 2 * 0.95;
    const lidGeo = new THREE.PlaneGeometry(lidSize, lidSize);
    const lidMat = new THREE.MeshPhysicalMaterial({
      map: lidTex,
      roughness: 0.24,
      metalness: 0.0,
      clearcoat: 0.6,
      clearcoatRoughness: 0.12,
      envMap: envMap,
      envMapIntensity: 0.08,
      transparent: true,
      alphaTest: 0.01,
    });
    const lidMesh = new THREE.Mesh(lidGeo, lidMat);
    lidMesh.rotation.x = -Math.PI / 2;
    lidMesh.rotation.z = Math.PI;
    lidMesh.position.y = topY + 0.002;
    canGroup.add(lidMesh);

    /* ── BOTTOM face (supplement facts / back) ── */
    const backTex = loader.load('/public/images/can-back-texture.png');
    cfgTex(backTex);

    const botY = -D / 2;
    const backSize = R * 2 * 0.93;
    const backGeo = new THREE.PlaneGeometry(backSize, backSize);
    const backMat = new THREE.MeshPhysicalMaterial({
      map: backTex,
      roughness: 0.24,
      metalness: 0.0,
      clearcoat: 0.6,
      clearcoatRoughness: 0.12,
      envMap: envMap,
      envMapIntensity: 0.08,
      transparent: true,
      alphaTest: 0.01,
    });
    const backMesh = new THREE.Mesh(backGeo, backMat);
    backMesh.rotation.x = Math.PI / 2;  // face downward
    backMesh.rotation.z = Math.PI;
    backMesh.position.y = botY - 0.002;
    canGroup.add(backMesh);

    /* ── Band texture ── */
    const bandTex = loader.load('/public/images/can-band-texture.png');
    cfgTex(bandTex);
    bandTex.wrapS = THREE.RepeatWrapping;
    bandTex.wrapT = THREE.ClampToEdgeWrapping;

    const bandGeo = new THREE.CylinderGeometry(R + 0.004, R + 0.004, D * 0.94, 160, 1, true);
    const bandMat = new THREE.MeshPhysicalMaterial({
      map: bandTex,
      roughness: 0.22,
      metalness: 0.04,
      clearcoat: 0.6,
      clearcoatRoughness: 0.15,
      envMap: envMap,
      envMapIntensity: 0.10,
      side: THREE.FrontSide,
    });
    const bandMesh = new THREE.Mesh(bandGeo, bandMat);
    bandMesh.position.y = 0;
    canGroup.add(bandMesh);

    /* ── NO shadow/reflection planes — clean background only ── */

    scene.add(canGroup);

    /* ═══════════════════════════════════════════════════
       LIGHTING
       ═══════════════════════════════════════════════════ */
    scene.add(new THREE.AmbientLight(0xe8eef6, 0.3));

    const key = new THREE.DirectionalLight(0xfff2e0, 0.9);
    key.position.set(4, 5, 4);
    scene.add(key);

    const fill = new THREE.DirectionalLight(0xd8e6f8, 0.4);
    fill.position.set(-5, 2, 3);
    scene.add(fill);

    const rim = new THREE.DirectionalLight(0xffffff, 0.6);
    rim.position.set(0, 2, -6);
    scene.add(rim);

    const top = new THREE.DirectionalLight(0xf0f4ff, 0.25);
    top.position.set(0, 9, 0);
    scene.add(top);

    const bounce = new THREE.DirectionalLight(0xf0e8d8, 0.1);
    bounce.position.set(0, -4, 2);
    scene.add(bounce);

    /* ── Mouse ── */
    let mx = 0, my = 0;
    wrap.addEventListener('mousemove', e => {
      const r = wrap.getBoundingClientRect();
      mx = ((e.clientX - r.left) / r.width - 0.5) * 2;
      my = ((e.clientY - r.top) / r.height - 0.5) * 2;
    });
    wrap.addEventListener('mouseleave', () => { mx = 0; my = 0; });

    /* ═══════════════════════════════════════════════════
       ANIMATION — oscillating tilt to show both faces
       The can spins around Y, and the X tilt rocks back
       and forth: tilted toward camera shows the TOP (branding),
       tilted away shows the BOTTOM (supplement facts).
       One full tilt cycle per Y revolution.
       ═══════════════════════════════════════════════════ */
    const clock = new THREE.Clock();
    const SPIN_SPEED = 0.35;   // Y rotation speed (radians/sec)
    const TILT_RANGE = 0.5;    // max tilt in each direction
    const TILT_CENTER = -0.1;  // slight bias toward showing the top

    (function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      // Y rotation — main spin
      canGroup.rotation.y = t * SPIN_SPEED;

      // Oscillating X tilt — synced to Y rotation so:
      //   front-facing = tilted to show top lid (branding)
      //   back-facing = tilted to show bottom (supplement facts)
      const tiltPhase = t * SPIN_SPEED; // same frequency as Y spin
      canGroup.rotation.x = TILT_CENTER + Math.sin(tiltPhase) * TILT_RANGE;

      // Gentle float
      canGroup.position.y = Math.sin(t * 0.4) * 0.025;

      // Mouse parallax (subtle)
      canGroup.rotation.x += my * 0.05;
      canGroup.rotation.z = mx * -0.03;

      renderer.render(scene, camera);
    })();

    window.addEventListener('resize', () => {
      const w = wrap.clientWidth, h = wrap.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    });
  })();
  </script>
</body>
</html>
