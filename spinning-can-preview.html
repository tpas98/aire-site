<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aire — Spinning Can Preview</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: linear-gradient(180deg, #e8f0f6 0%, #d4e4ee 40%, #f3f8fc 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  h1 {
    font-family: Georgia, 'Times New Roman', serif;
    color: #1a2e4a;
    font-size: 2.5rem;
    margin-bottom: 0.5rem;
    text-align: center;
  }
  .subtitle {
    color: #5a9bbf;
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 1.5rem;
  }
  #canvas-container {
    width: 550px;
    height: 550px;
    cursor: grab;
  }
  .note {
    color: #6b8aa5;
    font-size: 0.85rem;
    margin-top: 1rem;
    text-align: center;
  }
</style>
</head>
<body>
<div class="subtitle">The Lifestyle Pouch, Reimagined</div>
<h1>Spinning Can Preview</h1>
<div id="canvas-container"></div>
<p class="note">Move your mouse over the can to interact</p>

<script src="three.min.js"></script>
<script>
(function() {
  const mount = document.getElementById('canvas-container');
  const width = mount.clientWidth;
  const height = mount.clientHeight;

  const scene = new THREE.Scene();

  // Camera — straight on, eye level with the upright tin face
  const camera = new THREE.PerspectiveCamera(30, width / height, 0.1, 100);
  camera.position.set(0, 0, 6.5);
  camera.lookAt(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(width, height);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  mount.appendChild(renderer.domElement);

  // === TIN DIMENSIONS ===
  // The tin is flat and wide. When upright (face toward viewer):
  // - The circular face has a large radius (this is what you see)
  // - The "height" (depth/thickness) is small
  const tinRadius = 1.4;     // large face
  const tinDepth = 0.38;     // thin edge (the side of the tin)
  const lidOverhang = 0.04;
  const lidThickness = 0.05;

  const canGroup = new THREE.Group();

  const loader = new THREE.TextureLoader();
  let texturesLoaded = 0;
  function onTextureLoad() {
    texturesLoaded++;
    console.log('Texture loaded: ' + texturesLoaded + '/3');
  }

  // === FRONT FACE (Aire branding — the lid you see from above) ===
  const frontTexture = loader.load('public/images/can-front-texture.png', onTextureLoad);
  frontTexture.encoding = THREE.sRGBEncoding;
  frontTexture.minFilter = THREE.LinearMipmapLinearFilter;
  frontTexture.magFilter = THREE.LinearFilter;
  frontTexture.anisotropy = 8;

  const faceSize = (tinRadius + lidOverhang) * 2;
  const frontGeo = new THREE.PlaneGeometry(faceSize, faceSize);
  const frontMat = new THREE.MeshPhysicalMaterial({
    map: frontTexture,
    roughness: 0.25,
    metalness: 0.04,
    clearcoat: 0.6,
    clearcoatRoughness: 0.2,
    transparent: true,
    side: THREE.FrontSide,
  });
  const frontMesh = new THREE.Mesh(frontGeo, frontMat);
  frontMesh.position.z = tinDepth / 2 + lidThickness + 0.001;
  canGroup.add(frontMesh);

  // === BACK FACE (Supplement Facts) ===
  const backTexture = loader.load('public/images/can-back-texture.png', onTextureLoad);
  backTexture.encoding = THREE.sRGBEncoding;
  backTexture.minFilter = THREE.LinearMipmapLinearFilter;
  backTexture.magFilter = THREE.LinearFilter;
  backTexture.anisotropy = 8;

  const backGeo = new THREE.PlaneGeometry(faceSize, faceSize);
  const backMat = new THREE.MeshPhysicalMaterial({
    map: backTexture,
    roughness: 0.25,
    metalness: 0.04,
    clearcoat: 0.6,
    clearcoatRoughness: 0.2,
    transparent: true,
    side: THREE.FrontSide,
  });
  const backMesh = new THREE.Mesh(backGeo, backMat);
  backMesh.rotation.y = Math.PI; // face the other way
  backMesh.position.z = -(tinDepth / 2 + 0.001);
  canGroup.add(backMesh);

  // === EDGE / BODY (the thin rim — uses band texture) ===
  // CylinderGeometry along Y-axis, then rotate to be along Z-axis
  const edgeGeo = new THREE.CylinderGeometry(tinRadius, tinRadius, tinDepth, 64, 1, true);
  const bandTexture = loader.load('public/images/can-band-texture.png', onTextureLoad);
  bandTexture.encoding = THREE.sRGBEncoding;
  bandTexture.wrapS = THREE.RepeatWrapping;
  bandTexture.wrapT = THREE.ClampToEdgeWrapping;
  bandTexture.minFilter = THREE.LinearMipmapLinearFilter;
  bandTexture.magFilter = THREE.LinearFilter;
  bandTexture.anisotropy = 8;

  const edgeMat = new THREE.MeshPhysicalMaterial({
    map: bandTexture,
    roughness: 0.25,
    metalness: 0.1,
    clearcoat: 0.5,
    clearcoatRoughness: 0.25,
    side: THREE.DoubleSide,
  });
  const edgeMesh = new THREE.Mesh(edgeGeo, edgeMat);
  // Rotate cylinder from Y-axis to Z-axis (so circular face is on Z)
  edgeMesh.rotation.x = Math.PI / 2;
  canGroup.add(edgeMesh);

  // === LID RIM (slightly larger ring on front side) ===
  const lidRadius = tinRadius + lidOverhang;
  const lidRimGeo = new THREE.CylinderGeometry(lidRadius, lidRadius, lidThickness, 64);
  const rimColor = new THREE.Color(0.9, 0.92, 0.94);
  const lidRimMat = new THREE.MeshPhysicalMaterial({
    color: rimColor,
    roughness: 0.2,
    metalness: 0.1,
    clearcoat: 0.7,
    clearcoatRoughness: 0.15,
  });
  const lidRimMesh = new THREE.Mesh(lidRimGeo, lidRimMat);
  lidRimMesh.rotation.x = Math.PI / 2;
  lidRimMesh.position.z = tinDepth / 2 + lidThickness / 2;
  canGroup.add(lidRimMesh);

  // === SEAM RING (decorative ring where lid meets body) ===
  const seamGeo = new THREE.TorusGeometry(tinRadius + 0.008, 0.012, 16, 64);
  const seamMat = new THREE.MeshPhysicalMaterial({
    color: new THREE.Color(0.85, 0.87, 0.9),
    roughness: 0.2,
    metalness: 0.15,
  });
  const seamMesh = new THREE.Mesh(seamGeo, seamMat);
  seamMesh.position.z = tinDepth / 2;
  canGroup.add(seamMesh);

  // === BOTTOM RIM ===
  const bottomRimGeo = new THREE.TorusGeometry(tinRadius + 0.004, 0.01, 16, 64);
  const bottomRimMesh = new THREE.Mesh(bottomRimGeo, seamMat);
  bottomRimMesh.position.z = -tinDepth / 2;
  canGroup.add(bottomRimMesh);

  // === BOTTOM CAP (plain, back of tin body) ===
  const bottomCapGeo = new THREE.CircleGeometry(tinRadius, 64);
  const bottomCapMat = new THREE.MeshPhysicalMaterial({
    color: new THREE.Color(0.88, 0.91, 0.93),
    roughness: 0.35,
    metalness: 0.06,
  });
  const bottomCapMesh = new THREE.Mesh(bottomCapGeo, bottomCapMat);
  bottomCapMesh.rotation.y = Math.PI;
  bottomCapMesh.position.z = -tinDepth / 2;
  canGroup.add(bottomCapMesh);

  // Give a very slight tilt so it doesn't look perfectly flat/2D
  canGroup.rotation.x = 0.08;   // tiny tilt down
  canGroup.rotation.z = -0.03;  // tiny tilt right

  scene.add(canGroup);

  // === LIGHTING — clean studio setup ===
  scene.add(new THREE.AmbientLight(0xf0f4f8, 0.55));

  // Key light — warm, from upper right
  const keyLight = new THREE.DirectionalLight(0xfff8ee, 1.0);
  keyLight.position.set(4, 4, 5);
  scene.add(keyLight);

  // Fill light — cool, from left
  const fillLight = new THREE.DirectionalLight(0xe0eef6, 0.5);
  fillLight.position.set(-4, 2, 4);
  scene.add(fillLight);

  // Rim light — behind, creates edge highlights
  const rimLight = new THREE.DirectionalLight(0xffffff, 0.55);
  rimLight.position.set(0, 2, -5);
  scene.add(rimLight);

  // Top accent
  const topLight = new THREE.DirectionalLight(0xf0f0ff, 0.2);
  topLight.position.set(0, 6, 2);
  scene.add(topLight);

  // Bottom bounce
  const bounceLight = new THREE.DirectionalLight(0xd0e0f0, 0.12);
  bounceLight.position.set(0, -3, 3);
  scene.add(bounceLight);

  // === MOUSE INTERACTION ===
  let mouseX = 0, mouseY = 0;
  mount.addEventListener('mousemove', (e) => {
    const rect = mount.getBoundingClientRect();
    mouseX = ((e.clientX - rect.left) / rect.width - 0.5) * 2;
    mouseY = ((e.clientY - rect.top) / rect.height - 0.5) * 2;
  });
  mount.addEventListener('mouseleave', () => {
    mouseX = 0;
    mouseY = 0;
  });

  // === ANIMATE ===
  const clock = new THREE.Clock();
  const baseTiltX = 0.08;
  const baseTiltZ = -0.03;

  function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();

    // Smooth Y rotation — coin-spin showing front and back
    canGroup.rotation.y = t * 0.5;

    // Gentle floating
    canGroup.position.y = Math.sin(t * 0.4) * 0.025;

    // Mouse tilt
    const targetTiltX = baseTiltX + mouseY * 0.12;
    const targetTiltZ = baseTiltZ + mouseX * -0.1;
    canGroup.rotation.x += (targetTiltX - canGroup.rotation.x) * 0.04;
    canGroup.rotation.z += (targetTiltZ - canGroup.rotation.z) * 0.04;

    renderer.render(scene, camera);
  }
  animate();

  // === RESIZE ===
  window.addEventListener('resize', () => {
    const w = mount.clientWidth;
    const h = mount.clientHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  });
})();
</script>
</body>
</html>
