<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spinning Can – Aire</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(180deg, #e4edf6 0%, #dae5f0 50%, #d0dce8 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
    }
    #canvas-wrap { width: 700px; height: 620px; position: relative; }
    canvas { display: block; width: 100%; height: 100%; }
    .hint { text-align: center; color: #8a9bb5; font-size: 13px; margin-top: 10px; letter-spacing: 0.3px; }
  </style>
</head>
<body>
  <div id="canvas-wrap"></div>
  <p class="hint">Move your mouse over the can to interact</p>
  <script src="/three.min.js"></script>
  <script>
  (function() {
    const wrap = document.getElementById('canvas-wrap');
    const W = 700, H = 620;

    /* ── Scene ── */
    const scene = new THREE.Scene();

    /* ── Camera: product-photo angle — higher to show lid clearly ── */
    const camera = new THREE.PerspectiveCamera(26, W / H, 0.1, 100);
    camera.position.set(0, 4.2, 6.8);
    camera.lookAt(0, -0.15, 0);

    /* ── Renderer: high quality ── */
    const renderer = new THREE.WebGLRenderer({
      antialias: true, alpha: true,
      powerPreference: 'high-performance',
    });
    renderer.setSize(W, H);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.95;
    renderer.physicallyCorrectLights = true;
    wrap.appendChild(renderer.domElement);

    /* ── Soft environment for reflections ── */
    const eC = document.createElement('canvas');
    eC.width = 1024; eC.height = 512;
    const eCtx = eC.getContext('2d');
    const eGrad = eCtx.createLinearGradient(0, 0, 0, 512);
    eGrad.addColorStop(0, '#dce8f4');
    eGrad.addColorStop(0.35, '#f0f5fb');
    eGrad.addColorStop(0.5, '#ffffff');
    eGrad.addColorStop(0.65, '#edf2f8');
    eGrad.addColorStop(1, '#c8d8e8');
    eCtx.fillStyle = eGrad;
    eCtx.fillRect(0, 0, 1024, 512);
    // Soft highlight spots
    eCtx.globalAlpha = 0.12;
    eCtx.fillStyle = '#fff';
    eCtx.beginPath(); eCtx.arc(380, 100, 180, 0, Math.PI*2); eCtx.fill();
    eCtx.beginPath(); eCtx.arc(750, 150, 120, 0, Math.PI*2); eCtx.fill();
    eCtx.globalAlpha = 1;
    const envMap = new THREE.CanvasTexture(eC);
    envMap.mapping = THREE.EquirectangularReflectionMapping;

    /* ── Dimensions (matching real Aire tin proportions) ── */
    const R    = 1.50;   // body radius
    const D    = 0.82;   // body depth
    const lidR = R + 0.045; // lid overhangs body
    const lidH = 0.09;  // lid rim height
    const bev  = 0.055;  // bevel radius

    const canGroup = new THREE.Group();
    const loader = new THREE.TextureLoader();

    /* ── Helper: configure texture ── */
    function configTex(tex) {
      tex.encoding = THREE.sRGBEncoding;
      tex.minFilter = THREE.LinearMipmapLinearFilter;
      tex.magFilter = THREE.LinearFilter;
      tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
    }

    /* ── 1. LID TOP — PlaneGeometry (avoids CircleGeometry radial UV distortion) ── */
    const lidTex = loader.load('/public/images/can-front-texture.png');
    configTex(lidTex);

    const lidSize = lidR * 2;
    const lidGeo = new THREE.PlaneGeometry(lidSize, lidSize);
    const lidMat = new THREE.MeshPhysicalMaterial({
      map: lidTex,
      roughness: 0.28,
      metalness: 0.0,
      clearcoat: 0.55,
      clearcoatRoughness: 0.18,
      envMap: envMap,
      envMapIntensity: 0.12,
      transparent: true,
      alphaTest: 0.01,
    });
    const lidMesh = new THREE.Mesh(lidGeo, lidMat);
    lidMesh.rotation.x = -Math.PI / 2;
    lidMesh.rotation.z = Math.PI; // Rotate so text reads correctly from camera
    lidMesh.position.y = D / 2 + lidH + 0.001;
    canGroup.add(lidMesh);

    /* ── 2. LID RIM (vertical side of lid) ── */
    const rimCol = new THREE.Color().setRGB(0.93, 0.94, 0.96);
    const lidRimGeo = new THREE.CylinderGeometry(lidR, lidR, lidH, 128, 1, true);
    const lidRimMat = new THREE.MeshPhysicalMaterial({
      color: rimCol,
      roughness: 0.15,
      metalness: 0.06,
      clearcoat: 0.9,
      clearcoatRoughness: 0.08,
      envMap: envMap,
      envMapIntensity: 0.35,
    });
    const lidRimMesh = new THREE.Mesh(lidRimGeo, lidRimMat);
    lidRimMesh.position.y = D / 2 + lidH / 2;
    canGroup.add(lidRimMesh);

    /* ── 3. LID BEVEL (rounded top edge) ── */
    const bevGeo = new THREE.TorusGeometry(lidR - bev * 0.4, bev, 24, 128);
    const bevMat = new THREE.MeshPhysicalMaterial({
      color: new THREE.Color().setRGB(0.92, 0.93, 0.95),
      roughness: 0.12,
      metalness: 0.08,
      clearcoat: 1.0,
      clearcoatRoughness: 0.06,
      envMap: envMap,
      envMapIntensity: 0.45,
    });
    const bevMesh = new THREE.Mesh(bevGeo, bevMat);
    bevMesh.rotation.x = Math.PI / 2;
    bevMesh.position.y = D / 2 + lidH;
    canGroup.add(bevMesh);

    /* ── 4. LID-BODY SEAM (the groove/step where lid meets body) ── */
    const seamGeo = new THREE.TorusGeometry(R + 0.008, 0.018, 16, 128);
    const seamMat = new THREE.MeshPhysicalMaterial({
      color: new THREE.Color().setRGB(0.80, 0.82, 0.86),
      roughness: 0.22,
      metalness: 0.12,
      envMap: envMap,
      envMapIntensity: 0.25,
    });
    const seamMesh = new THREE.Mesh(seamGeo, seamMat);
    seamMesh.rotation.x = Math.PI / 2;
    seamMesh.position.y = D / 2 + 0.002;
    canGroup.add(seamMesh);

    /* ── 5. BODY WALL (cylinder with band texture) ── */
    const bandTex = loader.load('/public/images/can-band-texture.png');
    configTex(bandTex);
    bandTex.wrapS = THREE.RepeatWrapping;
    bandTex.wrapT = THREE.ClampToEdgeWrapping;

    const bodyGeo = new THREE.CylinderGeometry(R, R, D, 128, 1, true);
    const bodyMat = new THREE.MeshPhysicalMaterial({
      map: bandTex,
      roughness: 0.28,
      metalness: 0.04,
      clearcoat: 0.55,
      clearcoatRoughness: 0.18,
      envMap: envMap,
      envMapIntensity: 0.15,
      side: THREE.DoubleSide,
    });
    const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
    canGroup.add(bodyMesh);

    /* ── 6. BOTTOM CAP ── */
    const bottomGeo = new THREE.CircleGeometry(R, 128);
    const bottomMat = new THREE.MeshPhysicalMaterial({
      color: new THREE.Color().setRGB(0.87, 0.89, 0.92),
      roughness: 0.35,
      metalness: 0.04,
      clearcoat: 0.4,
      clearcoatRoughness: 0.2,
      envMap: envMap,
      envMapIntensity: 0.1,
    });
    const bottomMesh = new THREE.Mesh(bottomGeo, bottomMat);
    bottomMesh.rotation.x = Math.PI / 2;
    bottomMesh.position.y = -D / 2;
    canGroup.add(bottomMesh);

    /* ── 7. BOTTOM EDGE RING ── */
    const bEdgeGeo = new THREE.TorusGeometry(R + 0.003, 0.022, 16, 128);
    const bEdgeMat = new THREE.MeshPhysicalMaterial({
      color: new THREE.Color().setRGB(0.86, 0.88, 0.91),
      roughness: 0.18,
      metalness: 0.08,
      clearcoat: 0.75,
      clearcoatRoughness: 0.1,
      envMap: envMap,
      envMapIntensity: 0.3,
    });
    const bEdgeMesh = new THREE.Mesh(bEdgeGeo, bEdgeMat);
    bEdgeMesh.rotation.x = Math.PI / 2;
    bEdgeMesh.position.y = -D / 2;
    canGroup.add(bEdgeMesh);

    /* ── 8. INNER LID SHADOW (subtle dark ring inside body at lid seam) ── */
    const innerShadowGeo = new THREE.RingGeometry(R - 0.12, R, 128);
    const innerShadowMat = new THREE.MeshBasicMaterial({
      color: 0x667788,
      transparent: true,
      opacity: 0.08,
      side: THREE.DoubleSide,
    });
    const innerShadowMesh = new THREE.Mesh(innerShadowGeo, innerShadowMat);
    innerShadowMesh.rotation.x = -Math.PI / 2;
    innerShadowMesh.position.y = D / 2 - 0.01;
    canGroup.add(innerShadowMesh);

    /* ── Position the group ── */
    canGroup.rotation.x = -0.18; // slight product-photo tilt
    canGroup.rotation.z = 0.025;
    scene.add(canGroup);

    /* ══════════════════════════════════════════════════════════
       LIGHTING — Hyper-realistic 3-point studio + accents
       ══════════════════════════════════════════════════════════ */

    // Ambient — very soft base fill
    scene.add(new THREE.AmbientLight(0xeef2f8, 0.35));

    // Key light — warm, upper right front (main shadow caster)
    const keyLight = new THREE.DirectionalLight(0xfff4e6, 0.95);
    keyLight.position.set(4, 5.5, 4.5);
    scene.add(keyLight);

    // Fill light — cool, left side (opens shadows)
    const fillLight = new THREE.DirectionalLight(0xdce8f8, 0.4);
    fillLight.position.set(-4.5, 2.5, 3);
    scene.add(fillLight);

    // Rim light — strong back light for edge definition
    const rimLight = new THREE.DirectionalLight(0xffffff, 0.55);
    rimLight.position.set(0.5, 2, -5.5);
    scene.add(rimLight);

    // Top kicker — subtle overhead highlight on lid
    const topKick = new THREE.DirectionalLight(0xf4f6ff, 0.2);
    topKick.position.set(-1, 8, 1);
    scene.add(topKick);

    // Bottom bounce — warm reflected light from below
    const bounceLight = new THREE.DirectionalLight(0xe8ddd0, 0.08);
    bounceLight.position.set(0, -3, 2);
    scene.add(bounceLight);

    // Side accent — subtle catch light for realism
    const accentLight = new THREE.PointLight(0xf0f4ff, 0.15, 12);
    accentLight.position.set(3, 0.5, 2);
    scene.add(accentLight);

    /* ── Subtle contact shadow (ellipse below can) ── */
    const shGeo = new THREE.PlaneGeometry(4, 2.5);
    const shMat = new THREE.MeshBasicMaterial({
      color: 0x3a4a5c,
      transparent: true,
      opacity: 0.055,
    });
    const shMesh = new THREE.Mesh(shGeo, shMat);
    shMesh.rotation.x = -Math.PI / 2;
    shMesh.position.y = -D / 2 - 0.25;
    scene.add(shMesh);

    /* ══════════════════════════════════════════════════════════
       ANIMATION
       ══════════════════════════════════════════════════════════ */
    let mx = 0, my = 0;
    wrap.addEventListener('mousemove', e => {
      const r = wrap.getBoundingClientRect();
      mx = ((e.clientX - r.left) / r.width - 0.5) * 2;
      my = ((e.clientY - r.top) / r.height - 0.5) * 2;
    });
    wrap.addEventListener('mouseleave', () => { mx = 0; my = 0; });

    const clock = new THREE.Clock();
    const BASE_TILT_X = -0.18;
    const BASE_TILT_Z = 0.025;

    (function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      // Elegant slow rotation
      canGroup.rotation.y = t * 0.35;

      // Subtle floating
      canGroup.position.y = Math.sin(t * 0.45) * 0.035;

      // Mouse parallax tilt
      canGroup.rotation.x += (BASE_TILT_X + my * 0.12 - canGroup.rotation.x) * 0.025;
      canGroup.rotation.z += (BASE_TILT_Z - mx * 0.08 - canGroup.rotation.z) * 0.025;

      renderer.render(scene, camera);
    })();

    /* ── Resize ── */
    window.addEventListener('resize', () => {
      const w = wrap.clientWidth, h = wrap.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    });
  })();
  </script>
</body>
</html>
