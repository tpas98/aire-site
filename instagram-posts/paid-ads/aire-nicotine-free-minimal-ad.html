<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, initial-scale=1" />
  <link rel="stylesheet" href="../../aire-design-system/styles.css" />
  <title>Aire Minimal Instagram Ad</title>
  <style>
    * { box-sizing: border-box; }

    html,
    body {
      width: 1080px;
      height: 1350px;
      margin: 0;
      overflow: hidden;
      background: var(--aire-bg);
    }

    body {
      color: var(--aire-navy);
    }

    .ad {
      position: relative;
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(circle at 70% 62%, color-mix(in srgb, var(--aire-teal) 34%, transparent) 0%, color-mix(in srgb, var(--aire-teal) 16%, transparent) 24%, color-mix(in srgb, var(--aire-teal) 0%, transparent) 52%),
        var(--aire-grad-section);
    }

    .ad::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      opacity: 0.045;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.92' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 160px 160px;
      pointer-events: none;
      mix-blend-mode: multiply;
    }

    .logo {
      position: absolute;
      z-index: 4;
      top: 56px;
      left: 66px;
      width: 112px;
      height: auto;
      display: block;
    }

    .copy {
      position: relative;
      z-index: 3;
      padding: 172px 66px 0;
    }

    .ad-eyebrow {
      margin-bottom: 26px;
    }

    .ad-eyebrow .aire-eyebrow__line {
      width: 30px;
    }

    .ad-heading {
      width: 860px;
      font-size: 106px;
      line-height: 0.94;
      letter-spacing: 0;
    }

    .support {
      width: 760px;
      margin: 30px 0 0;
      font-size: 24px;
      line-height: 1.55;
      letter-spacing: 0;
      color: var(--aire-navy-mid);
      font-weight: 300;
    }

    .reason-row {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-top: 24px;
      font-size: 15px;
      line-height: 1;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--aire-muted);
      font-weight: 600;
      white-space: nowrap;
    }

    .reason-row span {
      display: inline-flex;
      align-items: center;
      gap: 18px;
    }

    .reason-row span + span::before {
      content: "";
      display: block;
      width: 5px;
      height: 5px;
      border-radius: 999px;
      background: var(--aire-teal);
      opacity: 0.9;
    }

    .product-wrap {
      position: absolute;
      z-index: 2;
      left: -118px;
      right: -95px;
      top: 592px;
      height: 628px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .product-wrap::before {
      content: "";
      position: absolute;
      left: 150px;
      right: 130px;
      bottom: 18px;
      height: 128px;
      border-radius: 50%;
      background: radial-gradient(ellipse, color-mix(in srgb, var(--aire-navy) 26%, transparent) 0%, color-mix(in srgb, var(--aire-navy) 13%, transparent) 44%, color-mix(in srgb, var(--aire-navy) 0%, transparent) 76%);
      filter: blur(19px);
      transform: rotate(-5deg);
    }

    .product {
      position: relative;
      z-index: 1;
      width: 984px;
      height: auto;
      display: block;
      transform: rotate(-2deg);
      filter:
        drop-shadow(0 24px 28px color-mix(in srgb, var(--aire-navy) 16%, transparent))
        drop-shadow(0 58px 86px color-mix(in srgb, var(--aire-navy) 14%, transparent));
    }

    .bottom {
      position: absolute;
      z-index: 4;
      left: 66px;
      right: 66px;
      bottom: 62px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .ad-button {
      min-width: 282px;
      height: 72px;
      padding: 0 44px;
      font-size: 16px;
    }

    .fine-print {
      position: absolute;
      z-index: 4;
      left: 50%;
      bottom: 24px;
      width: 700px;
      transform: translateX(-50%);
      font-size: 10px;
      line-height: 1.35;
      letter-spacing: 0.03em;
      color: var(--aire-muted);
      opacity: 0.52;
      font-weight: 400;
      text-align: center;
    }
  </style>
</head>
<body class="aire-root">
  <main class="ad" aria-label="Aire minimal Instagram ad">
    <img class="logo" src="../../public/images/logo.png" alt="Aire" />

    <section class="copy">
      <div class="aire-eyebrow ad-eyebrow">
        <span class="aire-eyebrow__line" aria-hidden="true"></span>
        <span class="aire-eyebrow__label">Calm Mint Pouches</span>
      </div>
      <h1 class="aire-heading aire-heading--xl ad-heading">A pouch <em>without</em> the nicotine.</h1>
      <p class="support">The ritual of a pouch. The calm of botanicals. None of the nicotine or caffeine.</p>
      <div class="reason-row" aria-label="Why choose Aire">
        <span>Familiar pouch feel</span>
        <span>Calm Mint flavor</span>
        <span>Botanical formula</span>
      </div>
    </section>

    <section class="product-wrap" aria-hidden="true">
      <img class="product" src="../../public/images/open-can-updated-cutout.png" alt="" />
    </section>

    <section class="bottom">
      <a class="aire-btn aire-btn--primary aire-btn--lg ad-button" href="https://airepouches.com">Order Aire</a>
    </section>

    <footer class="fine-print">Dietary supplement. Not intended to diagnose, treat, cure, or prevent any disease.</footer>
  </main>
</body>
</html>
